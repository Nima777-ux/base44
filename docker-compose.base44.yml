# Base44 sandbox/dev environment.
#
# The site is a dependency-free static build: semantic HTML + CSS + vanilla JS
# at the repository root. nginx serves those files straight from the bind mount,
# so edits appear on refresh with no build step (nothing is baked into an image).
#
# When a real application stack is added to this repo, replace `web` with the
# project's own development services (source bind-mounted + live-reload dev
# command) built on plain runtime base images. Never serve a prebuilt app image.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Only the site itself is published — the rest of the repo (including .git
      # and .base44) is never exposed over HTTP.
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    labels:
      - base44.project=go.arch
      - base44.kind=web
      - base44.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
